es:
  host: "http://localhost"
  port: 9200
  hub:
    name: goat
    release: 2021.10.15
    taxonomy: ncbi

assembly:
  accession: "{ACCESSION}"
  taxon_id: "{TAXON_ID}"

sequence_report:
  accession: "{ACCESSION}"
  taxon_id: "{TAXON_ID}"
  local_path: "{LOCAL_ROOT}/{ACCESSION}.sequence_report.jsonl"

bed:
  accession: "{ACCESSION}"
  taxon_id: "{TAXON_ID}"
  lines_per_unit: 1000
  windows:
    - type: size
      size: 1000000
      remnant_policy: Centered
    - type: proportion
      proportion: 0.1
  files:
    - path: "{REMOTE_ROOT}/{ACCESSION}/base_content/k1/{ACCESSION}.GC.1k.bedGraph.gz"
      local_path: "{LOCAL_ROOT}/{ACCESSION}.GC.1k.bedGraph.gz"
      value_columns:
        - label: gc
          index: 3
          type: float
          summary_functions:
            - name: mean
            - name: subwindow_variance
              value:
                size: 100
    - path: "{REMOTE_ROOT}/{ACCESSION}/base_content/k1/{ACCESSION}.N.1k.bedGraph.gz"
      local_path: "{LOCAL_ROOT}/{ACCESSION}.N.1k.bedGraph.gz"
      value_columns:
        - label: n
          index: 3
          type: float
          summary_functions:
            - name: mean

busco:
  accession: "{ACCESSION}"
  taxon_id: "{TAXON_ID}"
  tables:
    - path: "{REMOTE_ROOT}/{ACCESSION}/busco/{LINEAGE}/{ACCESSION}.{LINEAGE}.full_table.tsv.gz"
      local_path: "{LOCAL_ROOT}/{ACCESSION}.{LINEAGE}.full_table.tsv.gz"
      lineages:
        - anopheles_odb12
        - arthropoda_odb10
        - arthropoda_odb12
        - diptera_odb12
  algs:
    - name: diptera_alg
      lineage: diptera_odb12
      path: https://raw.githubusercontent.com/Obscuromics/diptera-ALGs/refs/heads/main/tables/ALGs_syngraph_diptera.tsv
      local_path: "{LOCAL_ROOT}/diptera_alg.tsv"

import:
  entity_types:
    - sequence
    - window
    - busco
    - attribute
  busco_tallies:
    lineages:
      - anopheles_odb12
      - arthropoda_odb10
      - arthropoda_odb12
      - diptera_odb12
    assembly_counts_output: "./busco_assembly_counts.tsv"
