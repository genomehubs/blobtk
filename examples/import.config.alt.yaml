es:
  host: "http://localhost"
  port: 9200
  hub:
    name: goat
    release: 2021.10.15
    taxonomy: ncbi
assembly:
  accession: &ACCESSION GCA_016920715.1
  taxon_id: &TAXON 7173
sequence_report:
  accession: *ACCESSION
  taxon_id: *TAXON
  path: "~/tmp/{ACCESSION}.sequence_report.jsonl"
bed:
  accession: *ACCESSION
  taxon_id: *TAXON
  lines_per_unit: 1000
  windows:
    - type: size
      size: 1000000
    - type: proportion
      proportion: 0.1
  files:
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/base_content/k1/{ACCESSION}.GC.1k.bedGraph.gz"
      value_columns:
        - label: gc
          index: 3
          type: float
          summary_functions: &SUMMARY_FUNCTIONS
            - name: mean
            - name: subwindow_variance
              value:
                size: 100
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/base_content/k1/{ACCESSION}.N.1k.bedGraph.gz"
      value_columns:
        - label: n
          index: 3
          type: float
          summary_functions: *SUMMARY_FUNCTIONS
busco:
  accession: *ACCESSION
  taxon_id: *TAXON
  tables:
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/busco/{LINEAGE}/{ACCESSION}.{LINEAGE}.full_table.tsv.gz"
      lineages: &LINEAGES
        - anopheles_odb12
        - arthropoda_odb10
        - arthropoda_odb12
        - diptera_odb12
  algs:
    - name: diptera_alg
      lineage: diptera_odb12
      path: https://raw.githubusercontent.com/Obscuromics/diptera-ALGs/refs/heads/main/tables/ALGs_syngraph_diptera.tsv
    - name: brachycera_alg
      lineage: diptera_odb12
      path: https://raw.githubusercontent.com/Obscuromics/diptera-ALGs/refs/heads/main/tables/ALGs_syngraph_brachycera.tsv
import:
  entity_types:
    - sequence
    - window
    - busco
    - attribute
  busco_tallies:
    lineages: *LINEAGES
    assembly_counts_output: "./busco_assembly_counts.tsv"
