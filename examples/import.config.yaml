es:
  host: "http://localhost"
  port: 9200
hub:
  name: goat
  release: 2021.10.15
  taxonomy: ncbi
assembly:
  accession: &ACCESSION GCA_016920705.1
  taxon_id: &TAXON 1518534
sequence_report:
  accession: *ACCESSION
  taxon_id: *TAXON
bed:
  accession: *ACCESSION
  taxon_id: *TAXON
  lines_per_unit: 1000
  windows:
    - type: size
      size: 1000000
    - type: proportion
      proportion: 0.1
  files:
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/base_content/k1/{ACCESSION}.GC.1k.bedGraph.gz"
      value_columns:
        - label: gc
          index: 3
          type: float
          summary_functions: &SUMMARY_FUNCTIONS
            - name: mean
            - name: subwindow_variance
              value:
                size: 100
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/base_content/k1/{ACCESSION}.N.1k.bedGraph.gz"
      value_columns:
        - label: n
          index: 3
          type: float
          summary_functions: *SUMMARY_FUNCTIONS
