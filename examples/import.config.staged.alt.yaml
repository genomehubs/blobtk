annotations:
  busco:
    source:
      path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/busco/{LINEAGE}/{ACCESSION}.{LINEAGE}.full_table.tsv.gz"
      local_path: "~/tmp/{ACCESSION}.{LINEAGE}.full_table.tsv.gz"
    assign_to: [feature]
    fields: {}
    algs:
      - name: diptera_alg
        lineage: diptera_odb12
        path: "https://raw.githubusercontent.com/Obscuromics/diptera-ALGs/refs/heads/main/tables/ALGs_syngraph_diptera.tsv"
        local_path: "~/tmp/diptera_alg.tsv"
        # primary alg used for BUSCO feature enrichment and synteny-block generation
      - name: brachycera_alg
        lineage: diptera_odb12
        path: "https://raw.githubusercontent.com/Obscuromics/diptera-ALGs/63446cba275a760af2a15750504927878e2f25a5/tables/ALGs_syngraph_brachycera.tsv"
        local_path: "~/tmp/brachycera_alg.tsv"
  # repeats:
  #   source:
  #     path: "https://example.org/{ACCESSION}/repeats.bed.gz"
  #     local_path: "~/tmp/{ACCESSION}.repeats.bed.gz"
  #   assign_to: [sequence, window]
  #   fields:
  #     repeat_density: float

windowing:
  bed_resolution: 1000
  windows:
    - type: size
      size: 1000000
      remnant_policy: Centered
      remnant_bounds:
        min_fraction: 0.67
        max_fraction: 1.33
    - type: proportion
      proportion: 0.1
      min_size: 100000
  files:
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/base_content/k1/{ACCESSION}.GC.1k.bedGraph.gz"
      local_path: "~/tmp/{ACCESSION}.GC.1k.bedGraph.gz"
      value_columns:
        - label: gc
          index: 3
          type: float
          summary_functions:
            - name: mean
          normalisation:
            method: zscore
            statistic: mean_std
            scope: assembly
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/base_content/k1/{ACCESSION}.N.1k.bedGraph.gz"
      local_path: "~/tmp/{ACCESSION}.N.1k.bedGraph.gz"
      value_columns:
        - label: n
          index: 3
          type: float
          summary_functions:
            - name: mean
          normalisation:
            method: zscore
            statistic: mean_std
            scope: assembly

assembly_policy:
  min_chromosome_fraction: 0.90
  fallback_mode: minimal

scaffold_policy:
  min_scaffold_length: 1000000
  skip_short_scaffolds_without_data: true
  index_small_scaffold_as_parent_if:
    - busco
    - annotation
    - synteny

indexing:
  profile: standard

# derived_metrics:
