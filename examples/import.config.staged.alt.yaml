#       - has_telomere_start
#       - has_telomere_end

import:
  entity_types:
    - sequence
    - window
    - busco
    - attribute
  busco_tallies:
    lineages:
      - diptera_odb12
    assembly_counts_output: "./busco_assembly_counts.tsv"
  synteny_index:
    enrich_busco_features: true
    index_synteny_loci: true
    index_synteny_blocks: true
