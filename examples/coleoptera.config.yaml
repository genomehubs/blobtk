busco:
  accession: *ACCESSION
  taxon_id: *TAXON
  tables:
    - path: "https://gap.cog.sanger.ac.uk/{ACCESSION}/busco-v0.3.0-20260625/{LINEAGE}/{ACCESSION}.{LINEAGE}.full_table.tsv.gz"
      lineages: &LINEAGES
        # - anopheles_odb12
        # - arthropoda_odb10
        # - arthropoda_odb12
        - coleoptera_odb12
import:
  entity_types:
    - sequence
    - window
    - busco
    - attribute
  busco_tallies:
    lineages: *LINEAGES
    assembly_counts_output: "./busco_assembly_counts.tsv"
  synteny_index:
    enrich_busco_features: true
    index_synteny_loci: true
    index_synteny_blocks: true
