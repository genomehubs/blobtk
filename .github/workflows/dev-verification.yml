name: dev-release-verification

on:
  push:
    branches:
      - develop
      - "feature/*"
  pull_request:
    branches:
      - develop

env:
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
      - name: Run tests
        working-directory: ./rust
        run: cargo test --all --lib --bins --target x86_64-unknown-linux-gnu
      - name: Check formatting
        working-directory: ./rust
        run: cargo fmt --check
      - name: Run clippy
        working-directory: ./rust
        run: |
          cargo clippy --all --target x86_64-unknown-linux-gnu -- \
            -W clippy::correctness \
            -W clippy::perf \
            -A unused

  linux-binary:
    uses: ./.github/workflows/build-linux-binary.yml
    with:
      rust_directory: ./rust
      target: x86_64-unknown-linux-gnu
      output_name: blobtk-linux
      artifact_name: binaries-linux
      rust_toolchain: "1.91.0"
      rustflags: "-C target-feature=+crt-static -C relocation-model=static"
    needs: [ test ]

  macos-binary:
    uses: ./.github/workflows/build-macos-binary.yml
    with:
      rust_directory: ./rust
      target: x86_64-apple-darwin
      output_name: blobtk-macos-x64
      artifact_name: binaries-macos-x64
      rust_toolchain: "1.91.0"
      mac_deployment_target: "10.13"
    needs: [ test ]

  macos-binary-arm64:
    uses: ./.github/workflows/build-macos-binary.yml
    with:
      rust_directory: ./rust
      target: aarch64-apple-darwin
      output_name: blobtk-macos-arm64
      artifact_name: binaries-macos-arm64
      rust_toolchain: "1.91.0"
      mac_deployment_target: "11.0"
    needs: [ test ]

  linux-wheels:
    uses: ./.github/workflows/build-wheels.yml
    with:
      rust_directory: ./rust
      python_versions: "[\"3.11\"]"
      target: x86_64-unknown-linux-gnu
      platform: linux
      rust_toolchain: "1.91.0"
    needs: [ test ]

  verify-linux-wheels:
    uses: ./.github/workflows/verify-wheels.yml
    with:
      python_versions: "[\"3.11\"]"
      artifact_prefix: "wheels-linux-"
      test_path: "tests/test_grid_smoke.py::test_grid_smoke"
    needs: [ linux-wheels ]

  verify-linux-binary:
    uses: ./.github/workflows/verify-binary.yml
    with:
      artifact_name: binaries-linux
      binary_glob: "blobtk-*"
    needs: [ linux-binary ]

  verify-docker-image:
    uses: ./.github/workflows/verify-docker.yml
    with:
      build_context: ./rust
      fixture_dir: tests/fixtures/minimal_blobdir
    needs: [ test ]
