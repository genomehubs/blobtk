name: release-blobtk

on:
  push:
    tags:
      - "*"
    branches:
      - develop
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run verification but skip publishing/pushing steps"
        required: false
        default: "true"

env:
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
      - name: Run tests
        working-directory: ./rust
        run: cargo test --all --lib --bins --target x86_64-unknown-linux-gnu
      - name: Check formatting
        working-directory: ./rust
        run: cargo fmt --check
      - name: Run clippy
        working-directory: ./rust
        run: |
          cargo clippy --all --target x86_64-unknown-linux-gnu -- -W clippy::correctness -W clippy::perf -A unused

  macos-binary:
    runs-on: macos-latest
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86_64-
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-apple-darwin
      - name: Build
        working-directory: ./rust
        run: |
          cargo build --target=x86_64-apple-darwin --release
      - name: Rename binary
        run: |
          mv ./rust/target/x86_64-apple-darwin/release/blobtk ./rust/target/x86_64-apple-darwin/release/blobtk-macos-x64
      - name: Verify macOS deployment target
        run: |
          bash ./.github/scripts/check-macos-min-version.sh ./rust/target/x86_64-apple-darwin/release/blobtk-macos-x64 10.13
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-x64
          path: rust/target/x86_64-apple-darwin/release/blobtk-macos-*

  macos-binary-arm64:
    runs-on: macos-latest
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64-
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - name: Build
        working-directory: ./rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --target=aarch64-apple-darwin --release
      - name: Rename binary
        run: |
          mv ./rust/target/aarch64-apple-darwin/release/blobtk ./rust/target/aarch64-apple-darwin/release/blobtk-macos-arm64
      - name: Verify macOS deployment target
        run: |
          bash ./.github/scripts/check-macos-min-version.sh ./rust/target/aarch64-apple-darwin/release/blobtk-macos-arm64 11.0
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-arm64
          path: rust/target/aarch64-apple-darwin/release/blobtk-macos-*

  linux-binary:
    runs-on: ubuntu-latest
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install static libraries for C
        run: sudo apt-get install -y libc6-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-unknown-linux-gnu
      - name: Build
        working-directory: ./rust
        run: |
          RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static" cargo build --target x86_64-unknown-linux-gnu --release
      - name: Rename binary
        run: |
          mv ./rust/target/x86_64-unknown-linux-gnu/release/blobtk ./rust/target/release/blobtk-linux
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: ./rust/target/release/blobtk-*

  sdist-wheels:
    runs-on: ubuntu-latest
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m rust/Cargo.toml
          rust-toolchain: 1.91.0
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  linux-wheels:
    runs-on: ubuntu-latest
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch' || (github.event_name == 'push' && github.ref ==
      'refs/heads/develop')
    strategy:
      matrix:
        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        target:
          - x86_64 # , x86, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Build custom manylinux image
        uses: docker/build-push-action@v4
        with:
          context: ./.github/manylinux
          file: ./.github/manylinux/Dockerfile
          push: false
          load: true
          tags: genomehubs/blobtk-manylinux:latest
      - name: Build wheels inside custom manylinux container
        env:
          PY: ${{ matrix.python }}
        run: |
          mkdir -p dist
          docker run --rm -e PY=${{ matrix.python }} -v "${{ github.workspace }}":/io -w /io genomehubs/blobtk-manylinux:latest /bin/bash -lc '
            set -e
            PYBIN=""
            for p in /opt/python/*/bin/python; do
              if "$p" -V 2>&1 | grep -q "Python $PY"; then
                PYBIN="$p"
                break
              fi
            done
            if [ -z "$PYBIN" ]; then echo "No Python $PY found in image"; exit 1; fi
            "$PYBIN" -m pip install --upgrade pip setuptools wheel
            "$PYBIN" -m pip install maturin
            "$PYBIN" -m maturin build --release --out /io/dist -i "$PYBIN" -m /io/rust/Cargo.toml --manylinux off
          '
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python }}
          path: dist

  # windows:
  #   runs-on: windows-latest
  #   strategy:
  #     matrix:
  #       target: [x64] # , x86]
  #   steps:
  #     - uses: actions/checkout@v3
  #     - uses: actions/setup-python@v4
  #       with:
  #         python-version: "3.10"
  #         architecture: ${{ matrix.target }}
  #     - name: Build wheels
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         target: ${{ matrix.target }}
  #         args: --release --out dist --find-interpreter -m rust/Cargo.toml
  #         sccache: "true"
  #     - name: Upload wheels
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: wheels-windows
  #         path: dist

  macos-wheels:
    runs-on: macos-latest
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    strategy:
      matrix:
        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python}}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python${{matrix.python}} --target
            x86_64-apple-darwin -m rust/Cargo.toml
          sccache: "true"
          rust-toolchain: 1.91.0
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
          MACOSX_DEPLOYMENT_TARGET: "10.13"
      - name: Build universal wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python${{matrix.python}} -m rust/Cargo.toml
          sccache: "true"
          rust-toolchain: 1.91.0
        env:
          RUSTUP_TOOLCHAIN: 1.91.0
          # Build for both Archs (arm64 requires macOS 11.0+)
          ARCHFLAGS: "-arch x86_64 -arch arm64"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Verify macOS deployment target in wheels
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            so_path=$(unzip -Z1 "$wheel" | grep -E '\.so$' | head -n1 || true)
            if [[ -z "$so_path" ]]; then
              echo "No extension module found in $wheel"
              continue
            fi
            tmpdir=$(mktemp -d)
            unzip -p "$wheel" "$so_path" > "$tmpdir/module.so"
            echo "== $wheel :: $so_path =="
            # Universal wheels contain arm64, so check for 11.0; x86_64-only wheels checked separately
            if file "$tmpdir/module.so" | grep -q "arm64"; then
              bash ./.github/scripts/check-macos-min-version.sh "$tmpdir/module.so" 11.0
            else
              bash ./.github/scripts/check-macos-min-version.sh "$tmpdir/module.so" 10.13
            fi
            rm -rf "$tmpdir"
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{matrix.python}}
          path: dist

  build-and-push-docker-develop:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: genomehubs/blobtk
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./rust
          push: true
          tags: genomehubs/blobtk:develop
          labels: ${{ steps.meta.outputs.labels }}

  create-conda-release-macos:
    name: Create conda release Mac
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    needs:
      - macos-binary
      - macos-wheels
    steps:
      - uses: actions/checkout@v3
      - uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          miniforge-version: "latest"
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
      - name: copy files
        run: |
          mkdir -p ./conda/dist
          cp ./dist/*/*macos*x86_64.whl ./conda/dist/
          cp ./dist/*/blobtk-macos-x64 ./conda/dist/blobtk
      - name: conda build
        run: |
          conda install -y conda-build
          export ANACONDA_API_TOKEN=${{ secrets.ANACONDA_API_TOKEN }}
          mkdir -p ./dist/osx-64
          conda build --no-anaconda-upload ./conda --output-folder ./dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: conda-macos
          path: dist/osx-64

  create-conda-release-linux:
    name: Create conda release Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    needs:
      - linux-binary
      - linux-wheels
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
      - name: copy files
        run: |
          mkdir -p ./conda/dist
          cp ./dist/*/*linux*.whl ./conda/dist/
          cp ./dist/*/blobtk-linux ./conda/dist/blobtk
      - uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-version: "latest"
          auto-activate-base: true
          activate-environment: ""
      - name: conda build
        run: |
          conda install -y conda-build
          export ANACONDA_API_TOKEN=${{ secrets.ANACONDA_API_TOKEN }}
          mkdir -p ./dist/linux-64
          conda build --no-anaconda-upload ./conda --output-folder ./dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: conda-linux
          path: dist/linux-64

  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - create-conda-release-linux
      - create-conda-release-macos
      - macos-binary-arm64
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
      - name: create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/binaries-*/blobtk-*
            dist/wheels-*/blobtk-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish crate
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.dry_run == 'false') }}
    needs:
      - create-github-release
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
      - name: Publish
        working-directory: ./rust
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }} --no-verify

  upload-to-pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.dry_run == 'false') }}
    needs:
      - create-github-release
      - verify-linux-wheels
      - verify-linux-binary
      - verify-macos-wheels
      - verify-macos-binary
      - verify-docker-image
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          cp -r ./dist/wheels-*/* ./
          rm -r dist
          ls -l
          pip install --upgrade twine
          twine upload --skip-existing *

  verify-linux-wheels:
    name: Verify Linux wheels
    runs-on: ubuntu-latest
    needs:
      - linux-wheels
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch' }}
    strategy:
      matrix:
        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python }}
          path: dist
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel and run import + smoke test
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest
          # Run a focused smoke test that generates an SVG using the minimal fixture
          pytest -q tests/test_grid_smoke.py::test_grid_smoke

  verify-linux-binary:
    name: Verify Linux binary
    runs-on: ubuntu-latest
    needs:
      - linux-binary
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux
          path: dist
      - name: Inspect and run binary smoke test
        run: |
          ls -l dist
          chmod +x dist/blobtk-*
          file dist/blobtk-*
          # Basic version check
          dist/blobtk-linux --version || true
          if command -v ldd >/dev/null 2>&1; then ldd dist/blobtk-linux || true; fi
          # Run the grid smoke command against the minimal fixture to exercise plotting
          dist/blobtk-linux plot --shape grid --view blob -d tests/fixtures/minimal_blobdir -o dist/out.svg
          ls -l dist/out.svg || true

  verify-macos-wheels:
    name: Verify macOS wheels
    runs-on: macos-latest
    needs:
      - macos-wheels
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch' }}
    strategy:
      matrix:
        python:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python }}
          path: dist
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel and run import + smoke test
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest
          pytest -q tests/test_grid_smoke.py::test_grid_smoke

  verify-macos-binary:
    name: Verify macOS binary
    runs-on: macos-latest
    needs:
      - macos-binary
      - macos-binary-arm64
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: binaries-macos-x64
          path: dist/x64
      - uses: actions/download-artifact@v4
        with:
          name: binaries-macos-arm64
          path: dist/arm64
      - name: Inspect and run binary smoke test
        run: |
          echo "x64 files:"
          ls -l dist/x64 || true
          echo "arm64 files:"
          ls -l dist/arm64 || true
          for bin in dist/x64/blobtk* dist/arm64/blobtk*; do
            if [ -f "$bin" ]; then
              chmod +x "$bin" || true
              echo "== $bin =="
              file "$bin" || true
              "$bin" --version || true
              OUT="dist/out_$(basename "$bin").svg"
              "$bin" plot --shape grid --view blob -d tests/fixtures/minimal_blobdir -o "$OUT" || true
              ls -l "$OUT" || true
            fi
          done

  build-and-push-docker-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    needs:
      - create-github-release
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: genomehubs/blobtk
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./rust
          push: true
          tags: genomehubs/blobtk:${{ env.VERSION }}, genomehubs/blobtk:latest
          labels: ${{ steps.meta.outputs.labels }}

  verify-docker-image:
    name: Verify Docker image
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Pull image (tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker pull genomehubs/blobtk:${{ env.VERSION }} || docker pull genomehubs/blobtk:latest
      - name: Build image (workflow_dispatch dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          IMG_TAG=genomehubs/blobtk:dry-run-${{ github.run_id }}
          docker build -t "$IMG_TAG" ./rust
          echo "Built $IMG_TAG"
      - name: Run smoke test in container
        run: |
          mkdir -p dist
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMG=genomehubs/blobtk:dry-run-${{ github.run_id }}
          else
            IMG=genomehubs/blobtk:${{ env.VERSION }}
          fi
          docker run --rm -v ${{ github.workspace }}/tests/fixtures/minimal_blobdir:/data/fixtures -v ${{ github.workspace }}/dist:/out $IMG blobtk plot --shape grid --view blob -d /data/fixtures -o /out/out-docker.svg
          ls -l dist/out-docker.svg || true

  upload-to-conda:
    name: Upload to conda
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name ==
      'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    needs:
      - create-github-release
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
      - uses: conda-incubator/setup-miniconda@v2
        with:
          miniconda-version: latest
          auto-activate-base: true
          activate-environment: ""
      - name: conda upload
        shell: bash -l {0}
        run: |
          ls -l ./dist
          ls -l ./dist/*
          conda install -y anaconda-client
          export ANACONDA_API_TOKEN=${{ secrets.ANACONDA_API_TOKEN }}
          anaconda upload --force --label main ./dist/conda-linux/*.conda
          anaconda upload --force --label main ./dist/conda-macos/*.conda
        # anaconda upload --force --label main ./dist/osx-arm64/*.tar.bz2
