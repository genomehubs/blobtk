name: develop-blobtk

on:
  push:
    branches:
      # - main
      - develop
      - feature/x*
    tags:
      - "*"

env:
  VERSION: 0.5.8

jobs:
  macos-binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: x86_64-apple-darwin
      - name: Build
        working-directory: ./rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: |
          cargo build --target=x86_64-apple-darwin --release
      - name: Rename binary
        run: |
          mv ./rust/target/x86_64-apple-darwin/release/blobtk ./rust/target/x86_64-apple-darwin/release/blobtk-macos-x64
      - name: Verify macOS deployment target
        run: |
          ./.github/scripts/check-macos-min-version.sh ./rust/target/x86_64-apple-darwin/release/blobtk-macos-x64 10.13
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-x64
          path: rust/target/x86_64-apple-darwin/release/blobtk-macos-*

  macos-binary-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - name: Build
        working-directory: ./rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: |
          cargo build --target=aarch64-apple-darwin --release
      - name: Rename binary
        run: |
          mv ./rust/target/aarch64-apple-darwin/release/blobtk ./rust/target/aarch64-apple-darwin/release/blobtk-macos-arm64
      - name: Verify macOS deployment target
        run: |
          ./.github/scripts/check-macos-min-version.sh ./rust/target/aarch64-apple-darwin/release/blobtk-macos-arm64 10.13
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-arm64
          path: rust/target/aarch64-apple-darwin/release/blobtk-macos-*

  linux-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install static libraries for C
        run: sudo apt-get install -y libc6-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: x86_64-unknown-linux-gnu
      - name: Run cargo metadata and detect editions
        run: |
          cd rust
          cargo metadata --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import json,sys
          m=json.load(open('/tmp/metadata.json'))
          for p in m.get('packages', []):
              name = p.get('name')
              ver = p.get('version')
              path = p.get('manifest_path')
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      for i, line in enumerate(f, 1):
                          if 'edition' in line:
                              print(f"{name} {ver} {path}:{i}: {line.strip()}")
              except Exception as e:
                  # some manifest paths may be inaccessible, but cargo fetched deps so usually ok
                  print(f"ERR reading {path}: {e}", file=sys.stderr)
          PY
      - name: Build
        working-directory: ./rust
        run: RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static" cargo build --target x86_64-unknown-linux-gnu --release
      - name: Rename binary
        run: |
          mv ./rust/target/x86_64-unknown-linux-gnu/release/blobtk ./rust/target/release/blobtk-linux
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: ./rust/target/release/blobtk-*

  build-and-push-docker-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: genomehubs/blobtk
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./rust
          push: true
          tags: genomehubs/blobtk:develop
          labels: ${{ steps.meta.outputs.labels }}
